[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "saarthi"
version = "0.1.0"
description = "An animated desktop companion that reacts to what you do on your computer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "icalendar>=5",
    "recurring-ical-events>=2.1",
    "pynput>=1.7",
    "evdev>=1.6; sys_platform == 'linux'",
    "jeepney>=0.8; sys_platform == 'linux'",
    "winrt-Windows.Media.Control>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
saarthi = "saarthi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
saarthi = ["skins/**/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Hardware/OS probes intentionally catch broad exceptions so one broken backend never crashes the app.
select = ["E", "F", "W", "I", "B", "SIM", "UP", "PLW1510"]
