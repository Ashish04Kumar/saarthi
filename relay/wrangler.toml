# Saarthi live relay. Deploy:  npm install && npm run deploy   (after `npx wrangler login`)
name = "saarthi-live"
main = "src/worker.js"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
